[controls]
scv-move-command=移动到位置
scv-queue-move-command=将移动指令加入队列

[mod-setting-name]
scv-command-queue-limit=指令队列上限
scv-show-path=显示移动路径

[mod-setting-description]
scv-command-queue-limit=每位玩家同时执行和等待执行的移动指令总数上限。
scv-show-path=寻路成功后短暂显示移动路径。

[scv-control]
queue-full=指令队列已满（上限：__1__）。
no-path=SCV 无法找到前往该位置的路径。
stuck=SCV 被卡住，当前指令已取消。
command-unavailable=SCV 当前无法执行该指令。
