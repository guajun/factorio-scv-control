[controls]
scv-move-command=移动到位置
scv-queue-move-command=将移动指令加入队列

[mod-setting-name]
scv-command-queue-limit=指令队列上限
scv-show-path=显示移动路径

[mod-setting-description]
scv-command-queue-limit=每位玩家同时执行和等待执行的移动指令总数上限。
scv-show-path=寻路成功后短暂显示移动路径。

[scv-control]
queue-full=指令队列已满（上限：__1__）。
no-path=SCV 无法找到前往该位置的路径。
stuck=SCV 被卡住，当前指令已取消。
command-unavailable=SCV 当前无法执行该指令。

[scv-test]
goal=SCV CONTROL 测试场\n右键点击绿色标记移动；按住 Shift 依次右键多个标记来排队；按 S 停止。按区域测试直线移动、绕障、窄通道、指令队列、不可达目标，以及未来的情境指令。
welcome=测试场已就绪，规划日志已启用。可用命令：/scv-test-home、/scv-test-reset、/scv-test-clear-log 和 /scv-test-bench
zone-straight=1  直线移动
zone-slalom=2  绕障路线
zone-corridor=3  窄通道
zone-queue=4  指令队列环线
zone-unreachable=5  不可达目标
zone-context=6  未来情境指令
command-reset-help=重建 SCV Control 测试场并返回出生点。
command-home-help=返回 SCV Control 测试场出生点。
command-clear-log-help=清空 SCV Control 的 JSONL 规划日志。
command-bench-help=列出或运行共享寻路夹具：/scv-test-bench [list|fixture-id] [algorithm|all]，默认运行 engine-alternate-global。
reset-complete=SCV Control 测试场已重建。
log-cleared=SCV Control 规划日志已清空。
