[controls]
scv-move-command=Move to position
scv-queue-move-command=Queue move to position

[mod-setting-name]
scv-command-queue-limit=Command queue limit
scv-show-path=Show movement path

[mod-setting-description]
scv-command-queue-limit=Maximum number of active and queued movement commands per player.
scv-show-path=Draw the path briefly when pathfinding succeeds.

[scv-control]
queue-full=Command queue is full (limit: __1__).
no-path=SCV cannot find a path to that position.
stuck=SCV is stuck; the current command was cancelled.
command-unavailable=SCV cannot execute that command in the current state.

[scv-test]
goal=SCV CONTROL TEST\nRight-click a green marker to move. Shift + right-click several markers to queue commands. Press S to stop. Use the labelled test zones to check straight paths, obstacle avoidance, narrow corridors, queued routes, unreachable targets, and future context actions.
welcome=Test lab ready. Planner logging and live plan comparison are active. Commands: /scv-test-home, /scv-test-reset, /scv-test-clear-log, /scv-test-preview, and /scv-test-bench
zone-straight=1  Straight movement
zone-slalom=2  Slalom obstacles
zone-corridor=3  Narrow corridor
zone-queue=4  Command queue loop
zone-unreachable=5  Unreachable target
zone-context=6  Future context actions
zone-strict-detours=7  Strict detour fixtures
command-reset-help=Rebuild the SCV Control test lab and return to spawn.
command-home-help=Return to the SCV Control test spawn.
command-clear-log-help=Clear the SCV Control planner JSONL log.
command-bench-help=List or run shared pathfinding fixtures: /scv-test-bench [list|fixture-id] [algorithm|all]. Defaults to engine-alternate-global.
command-preview-help=Control live comparison after normal move plans: /scv-test-preview [on|off|show|clear].
reset-complete=SCV Control test lab rebuilt.
log-cleared=SCV Control planner log cleared.
